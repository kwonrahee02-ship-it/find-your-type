<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>나는 어떤 유형일까? — 성격 유형 테스트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #14151a;
    --card: #1c1e26;
    --card-line: #2b2e39;
    --text: #eeece6;
    --text-dim: #9a9ca8;
    --gold: #e3a93d;
    --explorer: #e3a93d;
    --strategist: #3f9c93;
    --harmonizer: #cf7f8c;
    --doer: #6b7bdb;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: radial-gradient(circle at 50% -10%, #1d2029 0%, var(--bg) 55%);
    color: var(--text);
    font-family: 'IBM Plex Sans KR', sans-serif;
    min-height: 100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 24px 16px;
  }
  .app{
    width: 100%;
    max-width: 460px;
  }
  .display{
    font-family: 'Gowun Batang', serif;
  }
  .screen{ display:none; }
  .screen.active{ display:block; animation: fadeUp .5s ease; }
  @keyframes fadeUp{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }

  /* ---- 공통 카드 ---- */
  .card{
    background: var(--card);
    border: 1px solid var(--card-line);
    border-radius: 18px;
    padding: 32px 26px;
  }

  /* ---- 광고 배너 (가이드 6장 구조) ---- */
  .ad-banner{
    display:flex; align-items:center; justify-content:center;
    color: var(--text-dim);
    font-size: 11px;
    letter-spacing: .05em;
    border: 1px dashed var(--card-line);
    border-radius: 10px;
    margin: 14px auto 0;
  }
  #ad-banner-main, #ad-banner-middle{ width:320px; height:100px; max-width:100%; }
  #ad-banner-bottom{ width:320px; height:50px; max-width:100%; }

  /* ---- 시작 화면 ---- */
  .compass{
    width: 168px; height:168px; margin: 0 auto 22px;
    position: relative;
  }
  .compass svg{ width:100%; height:100%; }
  .compass-needle{
    transform-origin: 84px 84px;
    transition: transform 1.1s cubic-bezier(.22,1,.36,1);
  }
  .eyebrow{
    font-size:12px; letter-spacing:.18em; text-transform:uppercase;
    color: var(--gold); text-align:center; margin-bottom:10px; font-weight:600;
  }
  h1.title{
    font-size: 26px; text-align:center; margin: 0 0 14px; line-height:1.4;
  }
  p.lead{
    color: var(--text-dim); text-align:center; font-size:14.5px; line-height:1.6; margin:0 0 26px;
  }
  .type-preview{
    display:flex; justify-content:center; gap:10px; margin-bottom:26px; flex-wrap:wrap;
  }
  .chip{
    font-size:12px; padding:6px 12px; border-radius:20px;
    border:1px solid var(--card-line); color: var(--text-dim);
  }
  button{
    font-family: inherit; cursor:pointer; border:none;
  }
  .btn-primary{
    width:100%; padding:15px; border-radius: 12px;
    background: var(--gold); color:#1b1408; font-weight:700; font-size:15.5px;
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .btn-primary:hover{ transform: translateY(-1px); box-shadow: 0 8px 20px -8px var(--gold); }
  .btn-ghost{
    width:100%; padding:14px; border-radius:12px; margin-top:10px;
    background:transparent; border:1px solid var(--card-line); color:var(--text);
    font-size:14px;
  }

  /* ---- 질문 화면 ---- */
  .progress-row{
    display:flex; align-items:center; gap:10px; margin-bottom:22px;
  }
  .progress-track{
    flex:1; height:5px; border-radius:4px; background: var(--card-line); overflow:hidden;
  }
  .progress-fill{
    height:100%; border-radius:4px; background: var(--gold);
    transition: width .4s ease;
  }
  .progress-label{ font-size:12px; color:var(--text-dim); white-space:nowrap; }
  .q-index{
    font-size:12px; color:var(--gold); letter-spacing:.1em; margin-bottom:8px; font-weight:600;
  }
  .q-text{
    font-size:19px; line-height:1.5; margin: 0 0 22px;
  }
  .option{
    display:block; width:100%; text-align:left;
    background: #22242e; border:1px solid var(--card-line); color:var(--text);
    padding:14px 16px; border-radius:12px; margin-bottom:10px;
    font-size:14.5px; line-height:1.5;
    transition: border-color .15s ease, background .15s ease;
  }
  .option:hover{ border-color: var(--gold); background:#262838; }

  /* ---- 결과 화면 ---- */
  .result-image{
    width: 100%;
    max-width: 260px;
    aspect-ratio: 1 / 1;
    display:block;
    margin: 0 auto 18px;
    border-radius: 16px;
    border: 1px solid var(--card-line);
    object-fit: cover;
  }
  .result-badge{
    width:64px; height:64px; border-radius:50%; margin: 0 auto 16px;
    display:flex; align-items:center; justify-content:center;
    font-family:'Gowun Batang',serif; font-size:24px; font-weight:700; color:#14151a;
  }
  .result-tag{
    text-align:center; font-size:12px; letter-spacing:.14em; text-transform:uppercase;
    color: var(--text-dim); margin-bottom:6px;
  }
  h2.result-name{
    text-align:center; font-size:24px; margin:0 0 6px;
  }
  p.result-sub{
    text-align:center; color:var(--text-dim); font-size:14px; margin:0 0 20px;
  }
  .hashtags{
    display:flex; justify-content:center; gap:8px; flex-wrap:wrap; margin-bottom:20px;
  }
  .quote-box{
    border-left: 3px solid var(--gold);
    padding: 10px 14px; margin-bottom:20px;
    font-family:'Gowun Batang', serif; font-size:15.5px; color:#f3f1ea;
    background: rgba(227,169,61,0.06); border-radius: 0 8px 8px 0;
  }
  .desc{
    font-size:14px; line-height:1.75; color:#cfcdc6; margin-bottom:22px;
  }
  .stat-row{ margin-bottom:12px; }
  .stat-label{
    display:flex; justify-content:space-between; font-size:12.5px; color:var(--text-dim); margin-bottom:5px;
  }
  .stat-track{ height:6px; border-radius:4px; background:var(--card-line); overflow:hidden; }
  .stat-fill{ height:100%; border-radius:4px; }
  .fun-facts{
    display:grid; grid-template-columns: 1fr 1fr 1fr; gap:10px; margin: 22px 0;
  }
  .fun-fact{
    background:#20222b; border-radius:10px; padding:10px 12px;
  }
  .fun-fact .k{ font-size:10.5px; color:var(--text-dim); margin-bottom:3px; }
  .fun-fact .v{ font-size:13px; font-weight:500; }

  .share-title{
    font-size:12px; color:var(--text-dim); text-align:center; margin: 4px 0 12px; letter-spacing:.05em;
  }
  .share-row{
    display:flex; gap:9px; justify-content:center; margin-bottom:8px; flex-wrap:wrap;
  }
  .share-btn{
    width:46px; height:46px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:18px; border:1px solid var(--card-line); color:var(--text);
    background:#22242e;
    transition: transform .12s ease;
  }
  .share-btn:hover{ transform: translateY(-2px); }
  .share-btn.kakao{ background:#FEE500; color:#391b1b; border-color:#FEE500; }
  .share-btn.twitter{ background:#111; color:#fff; }
  .share-btn.naver{ background:#03C75A; color:#fff; border-color:#03C75A; }
  .share-btn.facebook{ background:#1877F2; color:#fff; border-color:#1877F2; }

  .footnote{
    text-align:center; font-size:11px; color:#666a76; margin-top:18px; line-height:1.6;
  }
</style>
</head>
<body>

<div class="app">

  <!-- ============ 0. 시작 화면 ============ -->
  <section id="screen-start" class="screen active">
    <div class="card">
      <div class="compass">
        <svg viewBox="0 0 168 168">
          <circle cx="84" cy="84" r="78" fill="none" stroke="#2b2e39" stroke-width="2"/>
          <circle cx="84" cy="84" r="58" fill="none" stroke="#2b2e39" stroke-width="1"/>
          <text x="84" y="18" text-anchor="middle" fill="#6a6d78" font-size="10" font-family="IBM Plex Sans KR">탐험</text>
          <text x="84" y="158" text-anchor="middle" fill="#6a6d78" font-size="10" font-family="IBM Plex Sans KR">실행</text>
          <text x="18" y="88" text-anchor="middle" fill="#6a6d78" font-size="10" font-family="IBM Plex Sans KR">전략</text>
          <text x="150" y="88" text-anchor="middle" fill="#6a6d78" font-size="10" font-family="IBM Plex Sans KR">조율</text>
          <g class="compass-needle" id="needle-start">
            <polygon points="84,30 90,84 84,90 78,84" fill="#e3a93d"/>
            <polygon points="84,138 90,84 84,78 78,84" fill="#4a4d59"/>
          </g>
          <circle cx="84" cy="84" r="5" fill="#eeece6"/>
        </svg>
      </div>
      <div class="eyebrow">Personality Compass</div>
      <h1 class="title display">나는 어떤 유형의<br/>사람일까?</h1>
      <p class="lead">질문 6개면 충분해요.<br/>당신의 성격이 가리키는 방향을 찾아드릴게요.</p>
      <div class="type-preview">
        <span class="chip">탐험가</span><span class="chip">전략가</span><span class="chip">조율자</span><span class="chip">실행가</span>
      </div>
      <button class="btn-primary" onclick="startQuiz()">테스트 시작하기</button>
    </div>
    <div class="ad-banner" id="ad-banner-main">광고 영역 (320×100)</div>
  </section>

  <!-- ============ 1. 질문 화면 ============ -->
  <section id="screen-quiz" class="screen">
    <div class="card">
      <div class="progress-row">
        <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
        <div class="progress-label" id="progress-label">1 / 6</div>
      </div>
      <div class="q-index" id="q-index">QUESTION 01</div>
      <p class="q-text" id="q-text"></p>
      <div id="options"></div>
    </div>
  </section>

  <!-- ============ 2. 결과 화면 ============ -->
  <section id="screen-result" class="screen">
    <div class="card">
      <img class="result-image" id="result-image" src="" alt="" />
      <div class="result-badge" id="result-badge"></div>
      <div class="result-tag">YOUR TYPE</div>
      <h2 class="result-name display" id="result-name"></h2>
      <p class="result-sub" id="result-sub"></p>
      <div class="hashtags" id="result-hashtags"></div>
      <div class="quote-box" id="result-quote"></div>
      <p class="desc" id="result-desc"></p>

      <div id="result-stats"></div>

      <div class="fun-facts" id="result-funfacts"></div>

      <div class="share-title">이 결과 공유하기</div>
      <div class="share-row">
        <button class="share-btn kakao" title="카카오톡 공유" onclick="shareKakao()">💬</button>
        <button class="share-btn twitter" title="트위터 공유" onclick="shareTwitter()">𝕏</button>
        <button class="share-btn naver" title="네이버 공유" onclick="shareNaver()">N</button>
        <button class="share-btn facebook" title="페이스북 공유" onclick="shareFacebook()">f</button>
        <button class="share-btn" title="링크 복사" onclick="copyLink()">🔗</button>
      </div>

      <button class="btn-ghost" onclick="restartQuiz()">다시 테스트하기</button>
    </div>
    <div class="ad-banner" id="ad-banner-middle">광고 영역 (320×100)</div>
    <div class="ad-banner" id="ad-banner-bottom" style="height:50px;">광고 영역 (320×50)</div>
    <p class="footnote">본 테스트는 데모용 샘플입니다. 실제 서비스에는<br/>카카오 애드핏 광고 코드와 카카오 SDK 키를 연결하세요.</p>
  </section>

</div>

<script>
/* ===========================================================
   1) 데이터: 4가지 유형 정의
   =========================================================== */
const TYPES = {
  explorer: {
    id: 'explorer',
    name: '탐험가',
    image: 'images/explorer.webp',
    color: 'var(--explorer)',
    sub: '지도 없이도 길을 찾는 사람',
    hashtags: ['#즉흥러', '#새로움중독', '#에너지뱅크'],

    desc: '낯선 상황에서 오히려 활력을 얻는 편이에요. 정해진 틀보다 그 순간의 흐름을 믿고, 지루한 반복보다 처음 해보는 일에 눈이 반짝입니다.',
    stats: [ ['호기심', 92], ['계획성', 34], ['친화력', 68] ],
    funfacts: [ ['행운의 아이템', '편도 티켓'], ['좋은 궁합', '실행가'], ['나쁜 궁합', '전략가'] ]
  },
  strategist: {
    id: 'strategist',
    name: '전략가',
    image: 'images/strategist.webp',
    color: 'var(--strategist)',
    sub: '머릿속에 이미 로드맵이 있다',
    hashtags: ['#계획충', '#근거러버', '#세줄요약장인'],
    quote: '“감이 아니라 데이터로 말해줄래?”',
    desc: '결정을 내리기 전에 항상 이유를 찾아요. 즉흥적인 선택보다 검증된 방법을 신뢰하고, 겉보기엔 차분하지만 머릿속은 늘 시뮬레이션 중이죠.',
    stats: [ ['분석력', 95], ['즉흥성', 21], ['추진력', 74] ],
    funfacts: [ ['행운의 아이템', '스프레드시트'], ['좋은 궁합', '조율자'], ['나쁜 궁합', '탐험가'] ]
  },
  harmonizer: {
    id: 'harmonizer',
    name: '조율자',
    image: 'images/harmonizer.webp',
    color: 'var(--harmonizer)',
    sub: '모두가 편한 게 곧 목표',
    hashtags: ['#분위기메이커', '#경청왕', '#갈등중재사'],
    quote: '“우리 둘 다 맞아, 다르게 말했을 뿐이야.”',
    desc: '사람들 사이의 온도를 가장 먼저 느껴요. 내 의견보다 관계의 균형을 먼저 살피고, 조용히 있어도 팀 분위기를 바꾸는 사람입니다.',
    stats: [ ['공감력', 96], ['단호함', 29], ['실행력', 55] ],
    funfacts: [ ['행운의 아이템', '따뜻한 차 한 잔'], ['좋은 궁합', '전략가'], ['나쁜 궁합', '실행가'] ]
  },
  doer: {
    id: 'doer',
    name: '실행가',
    image: 'images/doer.webp',
    color: 'var(--doer)',
    sub: '일단 해보고 얘기하자',
    hashtags: ['#추진력만렙', '#고민은짧게', '#결과로증명'],
    quote: '“생각은 걸으면서 하지.”',
    desc: '완벽한 계획보다 빠른 실행을 믿어요. 고민하는 시간보다 시행착오에서 더 많이 배우고, 팀에서는 마무리를 책임지는 포지션입니다.',
    stats: [ ['추진력', 94], ['신중함', 30], ['유연성', 61] ],
    funfacts: [ ['행운의 아이템', '체크리스트'], ['좋은 궁합', '탐험가'], ['나쁜 궁합', '조율자'] ]
  }
};

/* ===========================================================
   2) 데이터: 질문 6개 (선택지 4개 = 유형별 1점)
   =========================================================== */
const QUESTIONS = [
  { text: '주말 약속이 갑자기 취소됐다. 당신의 반응은?', options: [
    ['오히려 좋아, 즉흥적으로 어디 다녀올까?', 'explorer'],
    ['이 시간에 밀린 계획들 정리해야지', 'strategist'],
    ['누구 심심한 사람 없나 연락해볼까', 'harmonizer'],
    ['잘됐다, 밀린 일 끝내버리자', 'doer'],
  ]},
  { text: '새로운 프로젝트가 주어졌을 때 가장 먼저 하는 일은?', options: [
    ['일단 자료부터 이것저것 찾아본다', 'explorer'],
    ['전체 로드맵과 마일스톤을 짠다', 'strategist'],
    ['팀원들과 방향부터 맞춰본다', 'harmonizer'],
    ['바로 실행 가능한 태스크부터 처리한다', 'doer'],
  ]},
  { text: '여행 계획을 짤 때 나는?', options: [
    ['숙소만 정하고 나머진 즉흥으로', 'explorer'],
    ['시간 단위로 동선을 다 짜둔다', 'strategist'],
    ['같이 가는 사람 취향부터 물어본다', 'harmonizer'],
    ['목적지에 도착해서 바로 움직인다', 'doer'],
  ]},
  { text: '회의 중 의견이 갈릴 때 나는?', options: [
    ['새로운 대안을 던져본다', 'explorer'],
    ['데이터와 근거로 논리를 세운다', 'strategist'],
    ['양쪽 입장을 조율하려 한다', 'harmonizer'],
    ['일단 결론부터 내고 진행하자고 한다', 'doer'],
  ]},
  { text: '스트레스 받을 때 푸는 방법은?', options: [
    ['낯선 곳에 가서 걷는다', 'explorer'],
    ['원인을 분석하고 해결책을 찾는다', 'strategist'],
    ['친한 사람과 수다를 떤다', 'harmonizer'],
    ['몸을 움직이거나 청소를 한다', 'doer'],
  ]},
  { text: '팀에서 나는 주로 어떤 역할?', options: [
    ['새로운 아이디어를 던지는 사람', 'explorer'],
    ['큰 그림을 그리는 사람', 'strategist'],
    ['분위기를 챙기는 사람', 'harmonizer'],
    ['실행을 마무리 짓는 사람', 'doer'],
  ]},
];

/* ===========================================================
   3) 퀴즈 로직
   =========================================================== */
let currentQ = 0;
let scores = { explorer:0, strategist:0, harmonizer:0, doer:0 };
let currentResultData = null;

function show(screenId){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(screenId).classList.add('active');
}

function startQuiz(){
  currentQ = 0;
  scores = { explorer:0, strategist:0, harmonizer:0, doer:0 };
  show('screen-quiz');
  renderQuestion();
}

function renderQuestion(){
  const q = QUESTIONS[currentQ];
  document.getElementById('q-index').textContent = `QUESTION ${String(currentQ+1).padStart(2,'0')}`;
  document.getElementById('q-text').textContent = q.text;
  document.getElementById('progress-label').textContent = `${currentQ+1} / ${QUESTIONS.length}`;
  document.getElementById('progress-fill').style.width = `${(currentQ/QUESTIONS.length)*100}%`;

  const box = document.getElementById('options');
  box.innerHTML = '';
  q.options.forEach(([label, type]) => {
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.textContent = label;
    btn.onclick = () => selectAnswer(type);
    box.appendChild(btn);
  });
}

function selectAnswer(type){
  scores[type]++;
  currentQ++;
  if(currentQ < QUESTIONS.length){
    renderQuestion();
  } else {
    document.getElementById('progress-fill').style.width = '100%';
    setTimeout(showResult, 250);
  }
}

function getTopType(){
  return Object.entries(scores).sort((a,b) => b[1]-a[1])[0][0];
}

function showResult(typeId){
  const id = typeId || getTopType();
  const data = TYPES[id];
  currentResultData = data;
  renderResult(data);
  show('screen-result');

  // needle 방향: 유형별 각도 매핑 (탐험 0, 조율 90, 실행 180, 전략 270)
  const angleMap = { explorer:0, harmonizer:90, doer:180, strategist:270 };
  const needle = document.getElementById('needle-start');
  if(needle) needle.style.transform = `rotate(${angleMap[id]}deg)`;
}

function renderResult(data){
  const img = document.getElementById('result-image');
  img.src = data.image;
  img.alt = `${data.name} 캐릭터 이미지`;

  document.getElementById('result-badge').style.background = data.color;
  document.getElementById('result-badge').textContent = data.name[0];
  document.getElementById('result-name').textContent = data.name;
  document.getElementById('result-sub').textContent = data.sub;
  document.getElementById('result-quote').textContent = data.quote;
  document.getElementById('result-desc').textContent = data.desc;

  document.getElementById('result-hashtags').innerHTML =
    data.hashtags.map(h => `<span class="chip">${h}</span>`).join('');

  document.getElementById('result-stats').innerHTML = data.stats.map(([label, val]) => `
    <div class="stat-row">
      <div class="stat-label"><span>${label}</span><span>${val}%</span></div>
      <div class="stat-track"><div class="stat-fill" style="width:${val}%; background:${data.color};"></div></div>
    </div>
  `).join('');

  document.getElementById('result-funfacts').innerHTML = data.funfacts.map(([k,v]) => `
    <div class="fun-fact"><div class="k">${k}</div><div class="v">${v}</div></div>
  `).join('');
}

function restartQuiz(){
  history.replaceState(null, '', window.location.pathname);
  show('screen-start');
}

/* ===========================================================
   4) 공유 기능 (가이드 5장 구조)
   =========================================================== */
function getResultUrl(){
  const baseUrl = window.location.origin + window.location.pathname;
  const typeId = currentResultData ? currentResultData.id : 'default';
  return `${baseUrl}?result=${typeId}`;
}

function shareKakao(){
  // 실제 서비스에서는 Kakao Developers에서 발급받은 JavaScript 키로
  // Kakao.init('키값') 후 Kakao.Share.sendDefault(...)를 호출합니다.
  alert('데모 버전입니다. 실제 배포 시 카카오 JavaScript 키를 연결하면\n카카오톡 공유 카드가 여기서 바로 열려요.');
}

function shareTwitter(){
  const resultUrl = getResultUrl();
  const text = `나는 '${currentResultData.name}' 유형이 나왔어요!`;
  window.open(`https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}&url=${encodeURIComponent(resultUrl)}`, '_blank');
}

function shareNaver(){
  const resultUrl = getResultUrl();
  const title = `나는 '${currentResultData.name}' 유형이 나왔어요!`;
  window.open(`https://share.naver.com/web/shareView?url=${encodeURIComponent(resultUrl)}&title=${encodeURIComponent(title)}`, '_blank');
}

function shareFacebook(){
  window.open(`https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(getResultUrl())}`, '_blank');
}

function copyLink(){
  const resultUrl = getResultUrl();
  navigator.clipboard.writeText(resultUrl).then(() => {
    alert('링크 복사 완료!');
  }).catch(() => {
    alert('복사 실패! 주소창에서 직접 복사해 주세요');
  });
}

/* ===========================================================
   5) 공유된 결과 링크로 바로 진입 (?result=explorer 등)
   =========================================================== */
(function initFromUrl(){
  const params = new URLSearchParams(window.location.search);
  const result = params.get('result');
  if(result && TYPES[result]){
    showResult(result);
  }
})();
</script>
